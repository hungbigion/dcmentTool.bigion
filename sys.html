<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncfusion Gantt Chart - Demo Project Agency (Nâng cao)</title>
    
    <!-- Nhúng CSS của Syncfusion từ CDN -->
    <link href="https://cdn.syncfusion.com/ej2/material.css" rel="stylesheet" type="text/css"/>
    
    <!-- Nhúng JavaScript của Syncfusion từ CDN -->
    <script src="https://cdn.syncfusion.com/ej2/dist/ej2.min.js" type="text/javascript"></script>

    <!-- CSS tùy chỉnh cho màu sắc của các trạng thái -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 20px;
        }
        .main-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        /* Helper function to style taskbars */
        .e-gantt .e-gantt-taskbar > .e-taskbar-main-container,
        .e-gantt .e-gantt-taskbar > .e-taskbar-main-container > .e-gantt-child-taskbar-inner-div {
            border-radius: 4px;
        }
        
 /* --- Định nghĩa màu sắc cho các trạng thái --- */

    /* ==== child Completed - Xanh lá  ==== */
    .e-gantt .e-taskbar-main-container.completed .e-gantt-child-taskbar-inner-div {
        background-color: #A5D6A7 !important; /* nền xanh nhạt */
    }
    .e-gantt .e-taskbar-main-container.completed .e-gantt-child-progressbar-inner-div {
        background-color: #2E7D32 !important; /* progress xanh đậm */
    }
        /* ====Parent Completed - Xanh lá ==== */
    .e-gantt .e-taskbar-main-container.completed .e-gantt-parent-taskbar-inner-div {
        background-color: #A5D6A7 !important; /* nền xanh nhạt */
    }
    .e-gantt .e-taskbar-main-container.completed .e-gantt-parent-progressbar-inner-div {
        background-color: #2E7D32 !important; /* progress xanh đậm */
    }

    /* Màu chữ trong bảng (TaskName) */
    .e-treegrid .e-rowcell.completed {
        color: #2E7D32 !important;
        font-weight: 600;
    }

    /* ==== child In Progress - Vàng ==== */
    .e-gantt .e-taskbar-main-container.in-progress .e-gantt-child-taskbar-inner-div {
        background-color: #FFE082 !important; /* nền vàng nhạt */
    }
    .e-gantt .e-taskbar-main-container.in-progress .e-gantt-child-progressbar-inner-div {
        background-color: #FF8F00 !important; /* progress vàng cam đậm */
    }
        /* ==== parent In Progress - Vàng ==== */
    .e-gantt .e-taskbar-main-container.in-progress .e-gantt-parent-taskbar-inner-div {
        background-color: #FFE082 !important; /* nền vàng nhạt */
    }
    .e-gantt .e-taskbar-main-container.in-progress .e-gantt-parent-progressbar-inner-div {
        background-color: #FF8F00 !important; /* progress vàng cam đậm */
    }
    .e-treegrid .e-rowcell.in-progress {
        color: #FF8F00 !important;
        font-weight: 600;
    }

    /* ==== child On Hold - Đỏ ==== */
    .e-gantt .e-taskbar-main-container.on-hold .e-gantt-child-taskbar-inner-div {
        background-color: #EF9A9A !important; /* nền đỏ nhạt */
    }
    .e-gantt .e-taskbar-main-container.on-hold .e-gantt-child-progressbar-inner-div {
        background-color: #C62828 !important; /* progress đỏ đậm */
    }
        /* ==== parent On Hold - Đỏ ==== */
    .e-gantt .e-taskbar-main-container.on-hold .e-gantt-parent-taskbar-inner-div {
        background-color: #EF9A9A !important; /* nền đỏ nhạt */
    }
    .e-gantt .e-taskbar-main-container.on-hold .e-gantt-parent-progressbar-inner-div {
        background-color: #C62828 !important; /* progress đỏ đậm */
    }
    .e-treegrid .e-rowcell.on-hold {
        color: #C62828 !important;
        font-weight: 600;
    }

    /* ==== child Reviewing - Tím ==== */
    .e-gantt .e-taskbar-main-container.reviewing .e-gantt-child-taskbar-inner-div {
        background-color: #CE93D8 !important; /* nền tím nhạt */
    }
    .e-gantt .e-taskbar-main-container.reviewing .e-gantt-child-progressbar-inner-div {
        background-color: #6A1B9A !important; /* progress tím đậm */
    }
        /* ==== parent Reviewing - Tím ==== */
    .e-gantt .e-taskbar-main-container.reviewing .e-gantt-parent-taskbar-inner-div {
        background-color: #CE93D8 !important; /* nền tím nhạt */
    }
    .e-gantt .e-taskbar-main-container.reviewing .e-gantt-parent-progressbar-inner-div {
        background-color: #6A1B9A !important; /* progress tím đậm */
    }
    .e-treegrid .e-rowcell.reviewing {
        color: #6A1B9A !important;
        font-weight: 600;
    }

    /* ==== child Not Started - Xám ==== */
    .e-gantt .e-taskbar-main-container.not-started .e-gantt-child-taskbar-inner-div {
        background-color: #E0E0E0 !important; /* nền xám nhạt */
    }
    .e-gantt .e-taskbar-main-container.not-started .e-gantt-child-progressbar-inner-div {
        background-color: #616161 !important; /* progress xám đậm */
    }
        /* ==== parent Not Started - Xám ==== */
    .e-gantt .e-taskbar-main-container.not-started .e-gantt-parent-taskbar-inner-div {
        background-color: #E0E0E0 !important; /* nền xám nhạt */
    }
    .e-gantt .e-taskbar-main-container.not-started .e-gantt-parent-progressbar-inner-div {
        background-color: #616161 !important; /* progress xám đậm */
    }
    .e-treegrid .e-rowcell.not-started {
        color: #616161 !important;
        font-weight: 600;
    }

    /* ==== Task label trên thanh Gantt ==== */
    .e-gantt .e-task-label {
        color: #fff !important;
        font-size: 12px;
        text-shadow: 0 0 3px rgba(0,0,0,0.8);
    }
        
        /* --- Style cho text hiển thị trên thanh task --- */
        .e-gantt .e-gantt-taskbar .e-task-label {
            color: white;
            font-size: 12px;
            /* Thêm bóng mờ để chữ dễ đọc trên mọi màu nền */
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        
        /* --- Style cho tooltip --- */
        .custom-tooltip {
            padding: 8px;
            font-size: 13px;
        }
        .custom-tooltip strong {
            margin-right: 5px;
        }

    </style>
</head>
<body>

    <h1 class="main-title">Kế Hoạch Dự Án</h1>
    
    <!-- Element để render Gantt chart -->
    <div id="GanttChart" style="height: 550px;"></div>

    <script>
        // Dữ liệu mẫu cho dự án
        const dataSource = [
            { TaskID: 1, TaskName: 'Giai đoạn 1: Khởi động & Kế hoạch', StartDate: new Date('09/01/2025'), EndDate: new Date('09/15/2025'), Progress: 100, Status: 'Hoàn thành', CssClass: 'completed' },
            { TaskID: 2, TaskName: 'Họp khởi động dự án', StartDate: new Date('09/01/2025'), Duration: 2, Progress: 100, parentID: 1, Status: 'Hoàn thành', CssClass: 'completed', resources: [1] },
            { TaskID: 3, TaskName: 'Phân tích yêu cầu', StartDate: new Date('09/03/2025'), Duration: 4, Progress: 100, parentID: 1, Predecessor: '2FS', Status: 'Hoàn thành', CssClass: 'completed', resources: [1, 2] },
            { TaskID: 4, TaskName: 'Lập kế hoạch chi tiết', StartDate: new Date('09/09/2025'), Duration: 5, Progress: 100, parentID: 1, Predecessor: '3FS', Status: 'Hoàn thành', CssClass: 'completed', resources: [1] },
            { TaskID: 5, TaskName: 'Giai đoạn 2: Thiết kế UI/UX', StartDate: new Date('09/16/2025'), EndDate: new Date('10/03/2025'), Predecessor: '4FS', Progress: 70, Status: 'Đang thực hiện', CssClass: 'in-progress' },
            { TaskID: 6, TaskName: 'Nghiên cứu và xây dựng wireframe', StartDate: new Date('09/16/2025'), Duration: 7, Progress: 100, parentID: 5, Status: 'Hoàn thành', CssClass: 'completed', resources: [3] },
            // [CẬP NHẬT DỮ LIỆU] Thay đổi trạng thái để có nhiều màu sắc hơn
            { TaskID: 7, TaskName: 'Thiết kế giao diện (Mockup UI)', StartDate: new Date('09/25/2025'), Duration: 8, Progress: 50, parentID: 5, Predecessor: '6FS', Status: 'Tạm dừng', CssClass: 'on-hold', resources: [3] }, // Đổi sang màu đỏ
            { TaskID: 8, TaskName: 'Tạo prototype và trình bày', StartDate: new Date('10/06/2025'), Duration: 3, Progress: 25, parentID: 5, Predecessor: '7FS', Status: 'Đang duyệt', CssClass: 'reviewing', resources: [1, 3] }, // Giữ màu tím
            { TaskID: 9, TaskName: 'Giai đoạn 3: Phát triển (Development)', StartDate: new Date('10/06/2025'), EndDate: new Date('10/24/2025'), Predecessor: '8FS', Progress: 10, Status: 'Đang thực hiện', CssClass: 'in-progress' }, // Giữ màu vàng
            { TaskID: 10, TaskName: 'Phát triển Frontend', StartDate: new Date('10/06/2025'), Duration: 10, Progress: 20, parentID: 9, Status: 'Đang duyệt', CssClass: 'reviewing', resources: [4] }, // Đổi sang màu tím
            { TaskID: 11, TaskName: 'Phát triển Backend và Database', StartDate: new Date('10/06/2025'), Duration: 12, Progress: 15, parentID: 9, Status: 'Đang thực hiện', CssClass: 'in-progress', resources: [5] }, // Giữ màu vàng
            { TaskID: 12, TaskName: 'Tích hợp Frontend và Backend', StartDate: new Date('10/20/2025'), Duration: 5, Progress: 0, parentID: 9, Predecessor: '10FS,11FS', Status: 'Tạm dừng', CssClass: 'on-hold', resources: [4, 5] }, // Giữ màu đỏ
            { TaskID: 13, TaskName: 'Giai đoạn 4: Kiểm thử (QA) và Triển khai', StartDate: new Date('10/27/2025'), EndDate: new Date('11/07/2025'), Progress: 0, Predecessor: '12FS', Status: 'Chưa bắt đầu', CssClass: 'not-started' },
            { TaskID: 14, TaskName: 'Kiểm thử nội bộ và sửa lỗi', StartDate: new Date('10/27/2025'), Duration: 5, Progress: 0, parentID: 13, Status: 'Chưa bắt đầu', CssClass: 'not-started', resources: [2] },
            { TaskID: 15, TaskName: 'Triển khai lên server và bàn giao', StartDate: new Date('11/03/2025'), Duration: 5, Progress: 0, parentID: 13, Predecessor: '14FS', Status: 'Chưa bắt đầu', CssClass: 'not-started', resources: [1, 5] }
        ];

        // Dữ liệu về người thực hiện
        const resourcesData = [
            { resourceId: 1, resourceName: 'An (Manager)', avatar: '1DPMvklpnalCdLViGwzXHlbAdp_RFvcaL' },
            { resourceId: 2, resourceName: 'Bình (Tester)', avatar: '1DPMvklpnalCdLViGwzXHlbAdp_RFvcaL' },
            { resourceId: 3, resourceName: 'Chi (Designer)', avatar: '1DPMvklpnalCdLViGwzXHlbAdp_RFvcaL' },
            { resourceId: 4, resourceName: 'Dũng (Frontend)', avatar: '1DPMvklpnalCdLViGwzXHlbAdp_RFvcaL' },
            { resourceId: 5, resourceName: 'Em (Backend)', avatar: '1DPMvklpnalCdLViGwzXHlbAdp_RFvcaL' }
        ];


        // Khởi tạo Gantt Chart
        const gantt = new ej.gantt.Gantt({
            dataSource: dataSource,
            resources: resourcesData,
            height: '550px',
            allowSorting: true,
            allowResizing: true,
            
            // "Ánh xạ" các trường dữ liệu
            taskFields: {
                id: 'TaskID',
                name: 'TaskName',
                startDate: 'StartDate',
                endDate: 'EndDate',
                duration: 'Duration',
                progress: 'Progress',
                dependency: 'Predecessor',
                parentID: 'parentID',
                resourceInfo: 'resources',
                cssClass: 'CssClass',
            },
            
            // "Ánh xạ" dữ liệu người thực hiện
            resourceFields: {
                id: 'resourceId',
                name: 'resourceName',
            },

            // Cấu hình các cột hiển thị
            columns: [
                { field: 'TaskID', headerText: 'ID', textAlign: 'Right', width: '80' },
                { field: 'TaskName', headerText: 'Tên Công Việc', width: '300' },
                { field: 'resources', headerText: 'Người Thực Hiện', width: '200' },
                { field: 'Progress', headerText: 'Tiến Độ (%)', width: '120', textAlign: 'Center' },
                { field: 'Status', headerText: 'Trạng Thái', width: '150' },
                { field: 'StartDate', headerText: 'Ngày Bắt Đầu', format: 'dd/MM/yyyy', width: '150' },
                { field: 'Duration', headerText: 'Thời Lượng (ngày)', textAlign: 'Center', width: '150' }
            ],
            // Sử dụng labelSettings để hiển thị text trên thanh task
            labelSettings: {
                taskLabel: '${TaskName} - ${Progress}%'
            },

            // Cấu hình tooltip khi hover
            tooltipSettings: {
                showTooltip: true
            },
            // Hiển thị avatar + thông tin trong cell Resources
            queryCellInfo: function (args) {
                if (args.column.field === 'resources' && args.data.ganttProperties.resources) {
                    const container = document.createElement('div');
                    container.style.display = 'flex';
                    container.style.alignItems = 'center';
                    container.style.gap = '6px';

                    args.data.ganttProperties.resources.forEach(res => {
                        const user = resourcesData.find(r => r.resourceId === res.resourceId);
                        if (user) {
                            const img = document.createElement('img');
                            // ⚠️ Test trước với link ảnh ngoài (ví dụ Imgur)
                            img.src = `https://i.imgur.com/DSf1I3F.png`;
                            // Nếu muốn Google Drive: `https://drive.google.com/uc?id=${user.avatar}`
                            img.alt = user.resourceName;
                            img.style.width = '24px';
                            img.style.height = '24px';
                            img.style.borderRadius = '50%';

                            const span = document.createElement('span');
                            span.textContent = user.resourceName;
                            span.style.marginLeft = '4px';
                            span.style.fontSize = '13px';

                            const item = document.createElement('div');
                            item.style.display = 'flex';
                            item.style.alignItems = 'center';
                            item.appendChild(img);
                            item.appendChild(span);

                            container.appendChild(item);
                        }
                    });

                    args.cell.innerHTML = '';
                    args.cell.appendChild(container);
                }
            },

            // Tooltip nâng cao
            queryTooltipInfo: function (args) {
                if (args.data) {
                    const task = args.data;

                    let resourceHTML = '<i>Chưa gán</i>';
                    if (task.ganttProperties.resources && task.ganttProperties.resources.length) {
                        resourceHTML = task.ganttProperties.resources.map(res => {
                            const user = resourcesData.find(r => r.resourceId === res.resourceId);
                            if (!user) return '';
                            return `
                                <div style="display:flex;align-items:center;margin-bottom:4px;">
                                    <img src="https://i.imgur.com/DSf1I3F.png" 
                                        style="width:24px;height:24px;border-radius:50%;margin-right:6px;">
                                    <span>${user.resourceName}</span>
                                </div>`;
                        }).join('');
                    }

                    args.content = `
                        <div class='custom-tooltip'>
                            <div><strong>Công việc:</strong> ${task.TaskName}</div>
                            <div><strong>Trạng thái:</strong> ${task.Status}</div>
                            <div><strong>Tiến độ:</strong> ${task.Progress}%</div>
                            <div><strong>Thời gian:</strong> 
                                ${task.StartDate?.toLocaleDateString()} → ${task.EndDate?.toLocaleDateString()}
                            </div>
                            <div><strong>Người thực hiện:</strong><br>${resourceHTML}</div>
                        </div>
                    `;
                }
            },
                // 🔥 Thêm sự kiện rowDataBound để đổi màu chữ trong bảng
            rowDataBound: function (args) {
                if (args.data.CssClass) {
                    // lấy cell của cột TaskName
                    const cell = args.row.querySelector('[aria-label*="Task Name"], [aria-label*="Tên Công Việc"]');
                    if (cell) {
                        cell.classList.add(args.data.CssClass);
                    }
                }
            },
            // Đường kẻ phân cách giữa bảng và biểu đồ
            splitterSettings: {
                columnIndex: 3
            },

            // Thiết lập ngày bắt đầu và kết thúc của toàn dự án để hiển thị
            projectStartDate: new Date('08/28/2025'),
            projectEndDate: new Date('11/15/2025')
        });

        // Render Gantt chart vào thẻ div#GanttChart
        gantt.appendTo('#GanttChart');
        
    </script>

</body>
</html>
