<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  background-color: lightblue;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

#hoa-don {
  background-color: white;
  color: black;
  padding: 10px;
  width: 105mm;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

/* Định dạng chung */
body, table {
  font-family: sans-serif;
  font-size: 10pt;
}

/* Tiêu đề hóa đơn */
#header {
  text-align: center; /* Căn giữa nội dung trong div */
  margin-top: 0px; 
  margin-bottom: 15px;/* Tạo khoảng cách với phần tử bên dưới */
}

#ten-quan {
  font-size: 1.5em; /* Cỡ chữ lớn hơn */
  font-weight: bold; /* In đậm */
  margin-top: 0px; /* Khoảng cách phía trên */
  margin-bottom: 0; /* Loại bỏ khoảng cách mặc định phía dưới */
}

#dia-chi, #so-dien-thoai {
  font-size: 0.8em; /* Cỡ chữ bé hơn */
  margin: 0; /* Loại bỏ khoảng cách mặc định */
  font-weight: lighter;
}

/* Bảng hóa đơn */
table {
  width: 100%;
  border: none;
  border-collapse: collapse;
  /* font-size: 0.8em; */
}
tr{
  border-bottom: 1px solid #ddd;
}
th, td {
  padding: 5px;
  text-align: left;
  /* border: 1px solid #ddd; Thêm đường viền cho tất cả các ô */
}

/* Căn chỉnh nội dung trong bảng */
.label {
  font-weight: bold;
  width: 50px;
}

.right {
  text-align: left;
}

/* Tổng tiền */
.total {
  text-align: right;
  font-weight: bold;
  padding-top: 10px; /* Thêm khoảng cách phía trên */
}


/* In ấn */
@media print {
  body {
    background-color: white;
  }

  #hoa-don {
    box-shadow: none;
    margin-left: 2.5mm;
    margin-right: 2.5mm;
  }

  #in-button {
    display: none;
  }
  tr    { page-break-inside:avoid; page-break-after:avoid }
}

#in-button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 20px;
  background-color: #4CAF50;
  color: white;
  border: none;
  cursor: pointer;
}
    </style>
</head>
<body>
  <div id="hoa-don">
    <div id="header">
        <p id="ten-quan">Quán Làng Quê</p>
        <p id="dia-chi">DC: Xóm Tiền Phong - Nghi Diên</p>
        <p id="so-dien-thoai">Hotline: 0976 636 034 - 0342 461 033</p>
      </div>
  <table>
    <tr>
      <td class="label">H.Đơn:</td>
      <td id="bill-id"></td>
      <td class="label right">G.vào:</td>
      <td id="check-in"></td>
    </tr>
    <tr>
      <td class="label">Bàn:</td>
      <td id="ban-id"></td>
      <td class="label right">G.ra:</td>
      <td id="check-out"></td>
    </tr>
  </table>

  <table>
    <thead>
      <tr>
        <th>Tên món</th>
        <th>SL</th>
        <th>Đ.giá</th>
        <th>T.tiền</th>
      </tr>
    </thead>
    <tbody id="table-body">
    </tbody>
  </table>

  <div class="total">
    <span>Thành tiền:</span> <span id="subtotal"></span>
  </div>
  <div class="total">
    <span>Giảm giá:</span> <span id="discount"></span>
  </div>
  <div class="total">
    <span>Tổng cộng:</span> <span id="total"></span>
  </div>
</div>

<button id="in-button" onclick="window.print()">In Hóa Đơn</button>

    <script src="scripts1.js"></script></body>
</html>
